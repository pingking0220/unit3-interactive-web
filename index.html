<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>第 3 單元｜我們只有一個地球互動全景圖</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="unit-pill">第 3 單元</span>
        <div>
          <h1>我們只有一個地球｜互動知識全景圖</h1>
          <p>點選全景圖熱點、完成小測驗，逐步整理環境議題的因果關係。</p>
        </div>
      </div>
      <div class="top-actions" aria-label="全域工具">
        <div class="mode-switch" aria-label="模式切換">
          <button class="mode-button active" id="showPanorama" type="button">知識全景</button>
          <button class="mode-button" id="showGame" type="button">文字闖關</button>
        </div>
        <button class="tool-button active" id="toggleHotspots" type="button">熱點</button>
      </div>
    </header>

    <main class="workspace" id="panoramaWorkspace">
      <aside class="rail" aria-label="全景圖清單">
        <div class="rail-head">
          <span class="leaf-mark"></span>
          <div>
            <h2>學習路徑</h2>
            <p id="progressText">已完成 0 / 5</p>
          </div>
        </div>
        <div class="progress-track" aria-hidden="true">
          <span id="progressBar"></span>
        </div>
        <nav class="slide-nav" id="slideNav"></nav>
        <button class="ghost-button" id="resetProgress" type="button">重置學習進度</button>
      </aside>

      <section class="viewer-panel" aria-label="全景圖播放器">
        <div class="viewer-toolbar">
          <button class="circle-button" id="prevSlide" type="button" aria-label="上一張">‹</button>
          <div class="slide-heading">
            <span id="slideNumber"></span>
            <h2 id="slideTitle"></h2>
            <p id="slideSubtitle"></p>
          </div>
          <button class="circle-button" id="nextSlide" type="button" aria-label="下一張">›</button>
        </div>

        <div class="panorama-shell" id="panoramaShell">
          <figure class="panorama-frame" id="panoramaFrame">
            <img id="panoramaImage" src="" alt="">
            <div class="hotspot-layer" id="hotspotLayer"></div>
          </figure>
        </div>

        <div class="quick-strip" id="quickStrip" aria-label="本張重點"></div>
      </section>

      <aside class="study-panel" aria-label="學習面板">
        <div class="tabs" role="tablist" aria-label="學習面板分頁">
          <button class="tab active" data-tab="focus" type="button">重點</button>
          <button class="tab" data-tab="hotspot" type="button">熱點</button>
          <button class="tab" data-tab="quiz" type="button">小測驗</button>
        </div>

        <section class="tab-page active" id="focusPage">
          <div class="panel-title">
            <span class="round-badge">讀</span>
            <h2>本張導讀</h2>
          </div>
          <p class="lead" id="focusLead"></p>
          <div class="key-list" id="keyList"></div>
          <button class="primary-button" id="completeSlide" type="button">開始本張精熟測驗</button>
        </section>

        <section class="tab-page" id="hotspotPage">
          <div class="panel-title">
            <span class="round-badge">點</span>
            <h2 id="hotspotTitle">請點選全景圖上的熱點</h2>
          </div>
          <p class="lead" id="hotspotBody">每個熱點會補充概念、案例或課堂提問。</p>
          <div class="key-list" id="hotspotPoints"></div>
        </section>

        <section class="tab-page" id="quizPage">
          <div class="panel-title">
            <span class="round-badge">測</span>
            <h2>精熟測驗</h2>
          </div>
          <p class="lead" id="quizQuestion"></p>
          <div class="quiz-options" id="quizOptions"></div>
          <button class="primary-button" id="submitQuiz" type="button">送出本輪答案</button>
          <p class="quiz-feedback" id="quizFeedback" aria-live="polite"></p>
        </section>
      </aside>
    </main>

    <main class="game-screen is-hidden" id="gameScreen" aria-label="文字闖關遊戲">
      <section class="game-hero">
        <div>
          <span class="game-eyebrow">文字闖關模式</span>
          <h2>地球守護者：五大環境任務</h2>
          <p>閱讀任務、蒐集線索、做出選擇，再通過每關 5 題精熟挑戰。全部完成後，學生可以產生自己的永續行動宣言。</p>
        </div>
        <div class="game-progress-card">
          <strong id="gameProgressText">已取得 0 / 5 枚徽章</strong>
          <span id="gameProgressHint">完成每關測驗即可取得徽章。</span>
          <button class="ghost-button" id="resetGame" type="button">重置闖關進度</button>
        </div>
      </section>

      <section class="game-layout">
        <aside class="game-map" aria-label="關卡地圖">
          <h2>任務地圖</h2>
          <nav id="gameMap"></nav>
        </aside>

        <section class="game-card" aria-label="目前關卡">
          <div class="game-level-head">
            <span id="gameKicker">第 1 關</span>
            <h2 id="gameTitle"></h2>
            <p id="gameScene"></p>
          </div>

          <div class="game-mission">
            <strong id="gameRole"></strong>
            <span id="gameMission"></span>
          </div>

          <div class="clue-grid" id="gameClues"></div>

          <section class="choice-panel">
            <div class="mini-title">
              <span>選</span>
              <h3>任務判斷</h3>
            </div>
            <p id="gameChoicePrompt"></p>
            <div class="game-choices" id="gameChoices"></div>
            <p class="choice-feedback" id="gameChoiceFeedback" aria-live="polite"></p>
          </section>

          <section class="game-quiz-panel">
            <div class="mini-title">
              <span>測</span>
              <h3>精熟挑戰</h3>
            </div>
            <p id="gameQuizIntro"></p>
            <div class="game-quiz-list" id="gameQuizOptions"></div>
            <button class="primary-button" id="gameSubmitQuiz" type="button">送出闖關答案</button>
            <p class="quiz-feedback" id="gameQuizFeedback" aria-live="polite"></p>
          </section>
        </section>

        <aside class="badge-panel" aria-label="徽章與宣言">
          <h2>守護者徽章</h2>
          <div class="badge-list" id="badgeList"></div>

          <section class="pledge-panel" id="pledgePanel">
            <h3>我的永續行動宣言</h3>
            <p>完成五關後，選擇三項自己願意實踐的行動。</p>
            <div class="pledge-actions" id="pledgeActions"></div>
            <div class="pledge-result" id="pledgeResult"></div>
          </section>
        </aside>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
